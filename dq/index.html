function maxHP(L){return 13+Math.floor(L*5.7);}
function maxMP(L){return L<3?0:Math.floor((L-2)*4.6);}
function strOf(L){return 4+Math.floor(L*2.4);}
function agiOf(L){return 3+Math.floor(L*1.8);}
function expFor(L){return Math.floor(6*Math.pow(L-1,2.3));}
const MAXLV=20;

// ===== AUDIO =====
let AC=null;
function sfx(f,d=0.08,type='square',v=0.05){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),ga=AC.createGain();o.type=type;o.frequency.value=f;ga.gain.value=v;o.connect(ga);ga.connect(AC.destination);o.start();ga.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfx(f,0.18,'triangle',0.07),i*130));}

// ===== STATE =====
let scene='title',g=null,bt=null,statusOpen=false;
let msgQ=[],msgCb=null,msgText='';
const MS=[];
let endT=0,endLines=[];
const DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function rnd(n){return Math.floor(Math.random()*n);}

function newGame(){
g={name:'アレフ',lv:1,exp:0,hp:maxHP(1),mp:0,gold:30,wp:-1,ar:-1,sh:-1,herbs:2,wings:0,
map:'CAS',x:7,y:4,px:7,py:5,dir:'up',exit:{x:8,y:8},
flags:{princess:false,delivered:false,boss:false,chests:[]}};
}
function saveGame(){try{localStorage.setItem('dl_save',JSON.stringify(g));return true;}catch(e){return false;}}
function loadGame(){try{const s=localStorage.getItem('dl_save');if(!s)return false;g=JSON.parse(s);return true;}catch(e){return false;}}
function hasSave(){try{return !!localStorage.getItem('dl_save');}catch(e){return false;}}

// ===== MESSAGE =====
function say(s,cb){msgQ=Array.isArray(s)?s.slice():[s];msgCb=cb||null;msgText=msgQ.shift();}
function msgActive(){return msgText!=='';}
function advMsg(){sfx(740,0.03,'square',0.03);if(msgQ.length){msgText=msgQ.shift();}else{msgText='';const cb=msgCb;msgCb=null;if(cb)cb();}}

// ===== MENU =====
function openMenu(o){MS.push(Object.assign({sel:0,cancelable:true},o));sfx(660,0.04,'square',0.03);}
function menuInput(b){
const m=MS[MS.length-1];
if(b==='up'){m.sel=(m.sel+m.items.length-1)%m.items.length;sfx(880,0.03,'square',0.02);}
else if(b==='down'){m.sel=(m.sel+1)%m.items.length;sfx(880,0.03,'square',0.02);}
else if(b==='a'){const i=m.sel;MS.pop();if(m.onSel)m.onSel(i);}
else if(b==='b'){if(!m.cancelable)return;MS.pop();sfx(330,0.04,'square',0.03);if(m.onCancel)m.onCancel();}
}
function yesNo(cb,cancelable){openMenu({items:['はい','いいえ'],cancelable:!!cancelable,onSel:i=>cb(i===0),onCancel:()=>cb(false)});}

// ===== PLAYER STATS =====
function pAtkV(){return strOf(g.lv)+(g.wp>=0?WEAPONS[g.wp].a:0);}
function pDefV(){return Math.floor(agiOf(g.lv)/2)+(g.ar>=0?ARMORS[g.ar].d:0)+(g.sh>=0?SHIELDS[g.sh].d:0);}
function knownSpells(){return LEARN.filter(a=>g.lv>=a[0]).map(a=>a[1]);}
function calcDmg(atk,def){const base=atk-def/2;if(base<2)return Math.random()<0.4?0:1;return Math.max(0,Math.floor(base*(2+Math.random()*2)/8));}

// ===== FIELD =====
function tileAt(map,x,y){const m=MAPS[map];if(y<0||y>=m.length||x<0||x>=m[0].length)return map==='W'?'~':'#';return m[y][x];}
function blockedTile(t){return t==='#'||t==='~'||t==='M';}
function npcHidden(n){return (n.t==='princess'&&g.flags.princess)||(n.t==='boss'&&g.flags.boss);}
function npcAt(map,x,y){const l=NPCS[map];if(!l)return null;return l.find(n=>n.x===x&&n.y===y&&!npcHidden(n))||null;}

function tryMove(dx,dy,dir){
g.dir=dir;
const nx=g.x+dx,ny=g.y+dy;
const t=tileAt(g.map,nx,ny);
if(blockedTile(t)||npcAt(g.map,nx,ny))return;
g.px=g.x;g.py=g.y;g.x=nx;g.y=ny;
stepEvents(t);
}
function stepEvents(t){
const ck=g.map+':'+g.x+':'+g.y;
if(t==='c'&&!g.flags.chests.includes(ck)){g.flags.chests.push(ck);const v=CHESTS[ck]||50;g.gold+=v;sfx(990,0.15,'triangle',0.06);say('たからばこを あけた!\n'+v+'ゴールドを てにいれた!');return;}
if(t==='s'){g.hp=Math.max(0,g.hp-2);sfx(140,0.1,'sawtooth',0.04);if(g.hp<=0){die();return;}}
if(g.map==='W'){
const e=ENTER[t];
if(e){g.exit={x:e.ex,y:e.ey};g.map=e.map;g.x=e.x;g.y=e.y;g.px=e.x;g.py=e.y;g.dir='up';sfx(520,0.08);return;}
}else{
if(t==='E'){g.map='W';g.x=g.exit.x;g.y=g.exit.y;g.px=g.x;g.py=g.y;g.dir='down';sfx(520,0.08);return;}
if(t==='>'&&g.map==='CV1'){g.map='CV2';g.x=1;g.y=1;g.px=1;g.py=1;sfx(420,0.08);return;}
if(t==='<'&&g.map==='CV2'){g.map='CV1';g.x=14;g.y=10;g.px=14;g.py=10;sfx(420,0.08);return;}
}
maybeEncounter(t);
}
function zoneOf(){
if(g.map==='CV1')return 3;
if(g.map==='CV2')return 4;
if(g.map==='BOS')return 4;
const x=g.x,y=g.y;
if(y>=21&&x<=13)return 4;
if(y>=16)return 3;
if(x>=19)return 2;
return (Math.abs(x-8)+Math.abs(y-7))<8?0:1;
}
function maybeEncounter(t){
if(g.flags.boss)return;
let rate=0;
if(g.map==='W'){rate=(t==='t'||t==='h')?1/10:t==='s'?1/8:1/15;}
else if(g.map==='CV1'||g.map==='CV2')rate=1/11;
else if(g.map==='BOS')rate=1/12;
else return;
if(Math.random()<rate){const z=ZONES[zoneOf()];startBattle(z[rnd(z.length)]);}
}

function interact(){
const d=DIRS[g.dir],x=g.x+d.x,y=g.y+d.y;
const n=npcAt(g.map,x,y);
if(!n)return;
if(n.shop)shopMenu(n.shop);
else if(n.t==='king')kingTalk();
else if(n.t==='princess')say(['👸「たすけに きてくれたのですね!','わたしは セレナ。どうか おしろへ…」','セレナひめを つれていくことにした!'],()=>{g.flags.princess=true;fanfare();});
else if(n.t==='boss')bossTalk();
else say(n.d);
}
function kingTalk(){
if(g.flags.boss){say(['王「おお…せかいに ひかりが もどった!','そなたこそ まことの ゆうしゃじゃ!','このくにの でんせつとして かたりつがれるであろう」']);return;}
if(g.flags.princess&&!g.flags.delivered){
g.flags.delivered=true;g.gold+=300;fanfare();
say(['王「おお! セレナ! ぶじで なによりじゃ…!','ゆうしゃ アレフよ、れいを いうぞ。','ほうびに 300ゴールドを さずけよう!」','👸「アレフさま… どうか ごぶじで。おうえんしています」'],()=>kingHealSave());
return;
}
kingHealSave();
}
function kingHealSave(){
g.hp=maxHP(g.lv);g.mp=maxMP(g.lv);
say(['王「よくぞ もどった ゆうしゃよ。きずを いやしてやろう」','HPとMPが かいふくした!','王「ぼうけんのしょに きろくするか?」'],()=>{
yesNo(y=>{
if(y){const ok=saveGame();say(ok?'きろくした! ゆうきをもって すすむのじゃ!':'…きろくに しっぱいしたようじゃ。');}
else say('王「むりは するでないぞ」');
});
});
}
function bossTalk(){
say(['魔竜王「よくぞ きた ゆうしゃよ。','わしと てをくめば この よの はんぶんを くれてやろう。','どうじゃ?」'],()=>{
yesNo(y=>{
if(y)say(['魔竜王「ぐふふ… うそを つくでない。','ゆうしゃの ひとみは ごまかせぬわ!」'],()=>startBattle('boss1'));
else say('魔竜王「ならば ここで ほろびるがよい!」',()=>startBattle('boss1'));
});
});
}

function die(){
sfx(60,0.5,'sawtooth',0.06);
say([g.name+'は ちからつきた…','…','…めを さますと しろの なかだった。'],()=>{
g.gold=Math.floor(g.gold/2);
g.hp=maxHP(g.lv);g.mp=maxMP(g.lv);
g.map='CAS';g.x=7;g.y=4;g.px=7;g.py=5;g.dir='up';
bt=null;MS.length=0;scene='field';
say('王「おお '+g.name+'よ、いきておったか。\nもちものの はんぶんを ちりょうだいに もらったぞ。\nつぎは きをつけるのじゃ」');
});
}

// ===== BATTLE =====
function spawnM(k){const b=MONSTERS[k];const m=Object.assign({},b);m.key=k;m.hp=Math.floor(b.hp*(0.85+Math.random()*0.16));m.maxhp=m.hp;return m;}
function startBattle(k){
scene='battle';MS.length=0;bt={m:spawnM(k)};
sfx(200,0.2,'sawtooth',0.05);setTimeout(()=>sfx(150,0.2,'sawtooth',0.05),120);
say(bt.m.name+'が あらわれた!',()=>{
if(!bt.m.boss&&Math.random()<1/6)say('ふいを つかれた!',()=>eTurn());
else bcmd();
});
}
function bcmd(){
openMenu({title:'コマンド',items:['たたかう','じゅもん','どうぐ','にげる'],cancelable:false,battle:true,onSel:i=>{
if(i===0)pAttack();
else if(i===1)bSpellMenu();
else if(i===2)bItemMenu();
else flee();
}});
}
function pAttack(){
const m=bt.m;const atk=pAtkV();
const crit=!m.boss&&Math.random()<1/16;
const dmg=crit?Math.floor(atk*(0.7+Math.random()*0.3)):calcDmg(atk,m.def);
const L=[g.name+'の こうげき!'];
if(crit)L.push('かいしんの いちげき!!');
L.push(dmg>0?m.name+'に '+dmg+'の ダメージ!':'ミス! ダメージを あたえられない!');
sfx(dmg>0?180:90,0.1);
say(L,()=>{m.hp-=dmg;if(m.hp<=0)bWin();else eTurn();});
}
function bSpellMenu(){
const ks=knownSpells();
if(!ks.length){say('まだ じゅもんを おぼえていない!',()=>bcmd());return;}
openMenu({title:'じゅもん',items:ks.map(k=>SPELLS[k].n+'  MP'+SPELLS[k].mp),battle:true,onSel:i=>castB(ks[i]),onCancel:()=>bcmd()});
}
function castB(k){
const sp=SPELLS[k];
if(k==='return'){say('たたかいの さなかに つかえない!',()=>bcmd());return;}
if(g.mp<sp.mp){say('MPが たりない!',()=>bcmd());return;}
g.mp-=sp.mp;sfx(1200,0.15,'triangle',0.05);
const m=bt.m;
if(k==='heal'||k==='heal2'){
const v=k==='heal'?20+rnd(9):75+rnd(21);
say([g.name+'は '+sp.n+'を となえた!','HPが '+v+' かいふくした!'],()=>{g.hp=Math.min(maxHP(g.lv),g.hp+v);eTurn();});
}else{
const v=k==='fire'?9+rnd(8):28+rnd(13);
say([g.name+'は '+sp.n+'を となえた!',m.name+'に '+v+'の ダメージ!'],()=>{m.hp-=v;if(m.hp<=0)bWin();else eTurn();});
}
}
function bItemMenu(){
if(g.herbs<=0){say('つかえる どうぐを もっていない!',()=>bcmd());return;}
openMenu({title:'どうぐ',items:['やくそう ×'+g.herbs],battle:true,onSel:()=>{
g.herbs--;const v=25+rnd(11);sfx(900,0.1,'triangle',0.05);

function flee(){

if(Math.random()*agiOf(g.lv)>=Math.random()*m.agi*0.7){sfx(500,0.1);say(g.name+'は にげだした!',()=>{bt=null;scene='field';});}

function eTurn(){
const m=bt.m;let L=[],dmg=0;
if(m.spell&&Math.random()<0.35){
if(m.spell==='fire'){dmg=7+rnd(6);L=[m.name+'は ほのおのじゅもんを となえた!'];}
else if(m.spell==='fire2'){dmg=16+rnd(9);L=[m.name+'は ごうかのじゅもんを となえた!'];}
else{dmg=22+rnd(11);L=[m.name+'は はげしいほのおを はいた!'];}
L.push(g.name+'は '+dmg+'の ダメージを うけた!');
}else{
dmg=calcDmg(m.atk,pDefV());
L=[m.name+'の こうげき!'];

}
sfx(120,0.12,'sawtooth',0.05);
say(L,()=>{g.hp-=dmg;if(g.hp<=0){g.hp=0;die();}else bcmd();});

function bWin(){
const m=bt.m;
if(m.boss===1){
say(['魔竜王を うちたおした!','…だが くろいかげが ふくれあがっていく!','「ほう… なかなか やるではないか」','魔竜王が しんのすがたを あらわした!!'],()=>{bt={m:spawnM('boss2')};sfx(100,0.4,'sawtooth',0.07);bcmd();});
return;
}
if(m.boss===2){g.flags.boss=true;fanfare();say(['魔竜王は ほろびさった!','せかいに ひかりが もどっていく…!'],()=>ending());return;}
sfx(700,0.1,'triangle',0.05);
const L=[m.name+'を たおした!','けいけんち '+m.exp+'、'+m.gold+'ゴールドを かくとく!'];
g.exp+=m.exp;g.gold+=m.gold;
while(g.lv<MAXLV&&g.exp>=expFor(g.lv+1)){
const oh=maxHP(g.lv),om=maxMP(g.lv);
g.lv++;
g.hp+=maxHP(g.lv)-oh;g.mp+=maxMP(g.lv)-om;
L.push('♪ レベル '+g.lv+'に あがった!');
const sp=LEARN.find(a=>a[0]===g.lv);
if(sp)L.push(SPELLS[sp[1]].n+'の じゅもんを おぼえた!');
fanfare();
}
say(L,()=>{bt=null;scene='field';});
}

// ===== INPUT =====
const keys={};
let moveCd=0;
function onBtn(b){
if(scene==='title'){if(MS.length)menuInput(b);return;}
if(scene==='ending'){if(b==='a'&&endT>endLines.length*40+120)toTitle();return;}
if(statusOpen){if(b==='a'||b==='b'){statusOpen=false;sfx(330,0.04);}return;}
if(msgActive()){if(b==='a'||b==='b')advMsg();return;}
if(MS.length){menuInput(b);return;}
if(scene==='field'){
if(b==='a')interact();
else if(b==='b')fieldMenu();
}
}
addEventListener('keydown',e=>{
const k=e.key;
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
if(map[k]){keys[map[k]]=true;onBtn(map[k]);return;}
if(k==='z'||k==='Z'||k==='Enter'||k===' ')onBtn('a');
if(k==='x'||k==='X'||k==='Escape'||k==='Backspace')onBtn('b');
});
addEventListener('keyup',e=>{
const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
if(map[e.key])keys[map[e.key]]=false;
});

// touch controls
let TB={};
let touchDir=null;
function hitBtn(x,y){
for(const k in TB){const b=TB[k];if(Math.hypot(x-b.x,y-b.y)<b.r*1.25)return k;}
return null;
}
cv.addEventListener('pointerdown',e=>{
const k=hitBtn(e.clientX,e.clientY);
if(k==='a'||k==='b'){onBtn(k);return;}
if(k){touchDir=k;onBtn(k);return;}
if(isTouch&&!k)onBtn('a');
});
cv.addEventListener('pointermove',e=>{
if(touchDir){const k=hitBtn(e.clientX,e.clientY);if(k&&k!=='a'&&k!=='b')touchDir=k;}
});
cv.addEventListener('pointerup',()=>{touchDir=null;});
cv.addEventListener('pointercancel',()=>{touchDir=null;});

// ===== UPDATE =====
let last=0;
function update(dt){
moveCd-=dt;
if(scene==='field'&&!msgActive()&&!MS.length&&!statusOpen&&moveCd<=0){
let d=null;
if(touchDir)d=touchDir;
else for(const k of ['up','down','left','right'])if(keys[k]){d=k;break;}
if(d){tryMove(DIRS[d].x,DIRS[d].y,d);moveCd=0.14;}
}
if(scene==='ending')endT+=dt*60;
}

function winBox(x,y,w,h){
cx.fillStyle='rgba(0,0,24,0.92)';
cx.fillRect(x,y,w,h);
cx.strokeStyle='#fff';cx.lineWidth=3;
cx.strokeRect(x+4,y+4,w-8,h-8);
}
function txt(s,x,y,size,color,align){
cx.font=size+'px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
cx.fillStyle=color||'#fff';cx.textAlign=align||'left';cx.textBaseline='top';
cx.fillText(s,x,y);
}
function emoji(s,x,y,size){
cx.font=size+'px serif';cx.textAlign='center';cx.textBaseline='middle';
cx.fillText(s,x,y);
}
function wrapText(s,n){
const out=[];
for(const seg of String(s).split('\n')){
if(!seg.length){out.push('');continue;}
for(let i=0;i<seg.length;i+=n)out.push(seg.slice(i,i+n));
}
return out;
}
const TCOL={'.':'#3f8f42','t':'#2f7a35','h':'#7fa04f','M':'#8a8f96','~':'#2b5fc4','=':'#9c7444','s':'#5d4a7d','C':'#3f8f42','T':'#3f8f42','D':'#67a06a','B':'#3a3a44','#':'#5a5a66','_':'#a89878','r':'#aa3333','<':'#a89878','>':'#a89878','E':'#a89878','c':'#a89878'};
const TEMO={'t':'🌲','M':'⛰️','C':'🏰','T':'🏠','D':'🕳️','B':'🏯','E':'🚪','>':'🔽','<':'🔼'};

const mw=Math.min(W-16,640);

m.items.forEach(it=>{mw=Math.max(mw,it.length);});
mw=mw*fs+70;

function drawTouchUI(){
if(!isTouch)return;
const r=Math.min(46,W*0.07);
const cxp=r*2.1,cyp=H-r*2.1;
TB={
up:{x:cxp,y:cyp-r*1.5,r},down:{x:cxp,y:cyp+r*1.5,r},
left:{x:cxp-r*1.5,y:cyp,r},right:{x:cxp+r*1.5,y:cyp,r},
a:{x:W-r*1.6,y:H-r*2.9,r:r*1.1},b:{x:W-r*3.6,y:H-r*1.7,r:r*0.95}
};

cx.fillStyle=k==='a'?'#d44':k==='b'?'#46c':'#888';

cx.fillText({up:'↑',down:'↓',left:'←',right:'→',a:'A',b:'B'}[k],b.x,b.y);
}
cx.globalAlpha=1;
}
function drawField(){
const m=MAPS[g.map],mw=m[0].length,mh=m.length;
const ts=Math.max(28,Math.floor(Math.min(W/13,H/11)));
let camx=g.x*ts+ts/2-W/2,camy=g.y*ts+ts/2-H/2;
camx=Math.max(0,Math.min(camx,mw*ts-W));camy=Math.max(0,Math.min(camy,mh*ts-H));
if(mw*ts<W)camx=(mw*ts-W)/2;
if(mh*ts<H)camy=(mh*ts-H)/2;
cx.fillStyle='#000';cx.fillRect(0,0,W,H);
const x0=Math.max(0,Math.floor(camx/ts)),y0=Math.max(0,Math.floor(camy/ts));
const x1=Math.min(mw-1,Math.ceil((camx+W)/ts)),y1=Math.min(mh-1,Math.ceil((camy+H)/ts));
const dark=DARK[g.map];
for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
if(dark&&Math.hypot(x-g.x,y-g.y)>dark)continue;
const t=m[y][x];
const sx=x*ts-camx,sy=y*ts-camy;
cx.fillStyle=TCOL[t]||'#222';
cx.fillRect(sx,sy,ts+1,ts+1);
if(t==='#'){cx.strokeStyle='rgba(0,0,0,0.25)';cx.lineWidth=1;cx.strokeRect(sx+2,sy+2,ts-4,ts/2-2);cx.strokeRect(sx+2,sy+ts/2,ts-4,ts/2-2);}
if(t==='='){cx.strokeStyle='#6b4d2a';cx.lineWidth=2;for(let i=1;i<4;i++){cx.beginPath();cx.moveTo(sx,sy+i*ts/4);cx.lineTo(sx+ts,sy+i*ts/4);cx.stroke();}}
if(t==='s'){cx.fillStyle='rgba(30,20,50,0.5)';cx.beginPath();cx.arc(sx+ts*0.3,sy+ts*0.4,ts*0.12,0,7);cx.arc(sx+ts*0.7,sy+ts*0.65,ts*0.1,0,7);cx.fill();}
if(t==='c'&&!g.flags.chests.includes(g.map+':'+x+':'+y))emoji('📦',sx+ts/2,sy+ts/2,ts*0.7);
const e=TEMO[t];
if(e)emoji(e,sx+ts/2,sy+ts/2,ts*0.8);
}
const npcs=NPCS[g.map]||[];
for(const n of npcs){
if(npcHidden(n))continue;
if(dark&&Math.hypot(n.x-g.x,n.y-g.y)>dark)continue;
emoji(n.e,n.x*ts-camx+ts/2,n.y*ts-camy+ts/2,ts*0.8);
}
if(g.flags.princess&&!g.flags.delivered)
emoji('👸',g.px*ts-camx+ts/2,g.py*ts-camy+ts/2,ts*0.75);
emoji('🤺',g.x*ts-camx+ts/2,g.y*ts-camy+ts/2,ts*0.85);
drawHud();
}

if(y>-fs&&y<H+fs)txt(l,W/2,y,l==='THE END'?fs*1.4:fs,l.includes('LEGEND')||l==='THE END'?'#ffd95e':'#fff','center');
});
if(endT>endLines.length*40+120&&Math.floor(Date.now()/500)%2===0)
txt('PRESS A',W/2,H*0.9,fs*0.6,'#888','center');
cx.textAlign='left';
}
function draw(){
if(scene==='title')drawTitle();
else if(scene==='field')drawField();
else if(scene==='battle')drawBattle();
else if(scene==='ending')drawEnding();
if(statusOpen)drawStatus();
if(MS.length&&scene!=='title')drawMenus();
if(scene==='title'&&MS.length){
const m=MS[0];
const fs=Math.min(W/18,28);
const items=m.items;
const w=fs*9,h=items.length*fs*1.7+30;
const x=(W-w)/2,y=H*0.55;
winBox(x,y,w,h);
items.forEach((it,i)=>{
if(i===m.sel)txt('▶',x+fs,y+20+i*fs*1.7,fs);
txt(it,x+fs*2.4,y+20+i*fs*1.7,fs,i===m.sel?'#fff':'#bbb');
});
}
if(msgActive())drawMsgWin();
if(scene==='field'||scene==='battle')drawTouchUI();
}

// ===== MAIN LOOP =====
function loop(t){
const dt=Math.min(0.05,(t-last)/1000);last=t;
update(dt);
draw();
requestAnimationFrame(loop);
}
toTitle();
requestAnimationFrame(loop);
</script>
</body>
